  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060611;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(150px);
      pointer-events: none;
    }
    .glow-1 {
      width: 350px; height: 350px;
      top: -80px; right: -60px;
      background: rgba(0, 210, 255, 0.10);
    }
    .glow-2 {
      width: 300px; height: 300px;
      bottom: -100px; left: -60px;
      background: rgba(123, 82, 214, 0.08);
    }

    .container {
      position: relative;
      width: 400px;
      max-width: 94vw;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .container.ready {
      opacity: 1;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(12, 15, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 210, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0, 210, 255, 0.04);
    }

    /* Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-style: italic;
    }

    .id-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #00d2ff;
      white-space: nowrap;
    }
    .id-badge svg { width: 12px; height: 12px; }

    .card-subtitle {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Progress section */
    .progress-section {
      margin-bottom: 20px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .progress-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .progress-icon.green {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .progress-icon svg { width: 18px; height: 18px; }

    .progress-info { flex: 1; }

    .progress-label {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 2px;
    }

    .progress-count {
      font-size: 15px;
      font-weight: 700;
      color: #00d2ff;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-track-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #22c55e);
      border-radius: 3px;
      transition: width 0.5s ease;
      width: 0%;
    }

    /* Stats cards */
    .stats-row {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }

    .stat-card {
      flex: 1;
      background: rgba(0, 210, 255, 0.04);
      border: 1px solid rgba(0, 210, 255, 0.12);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #00d2ff;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
    }

    /* Status box */
    .status-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .status-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .status-text .success { color: #22c55e; }
    .status-text .error { color: #ef4444; }
    .status-text .warning { color: #f59e0b; }

    .spinner {
      width: 22px; height: 22px;
      border: 3px solid rgba(0, 210, 255, 0.2);
      border-top-color: #00d2ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }



    /* Buttons */
    .watch-btn {
      display: none;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7B52D6 0%, #00d2ff 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(123, 82, 214, 0.3);
      letter-spacing: 0.04em;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .watch-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(123, 82, 214, 0.4);
    }
    .watch-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .watch-btn svg { width: 20px; height: 20px; }

    .close-btn {
      display: none;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
      margin-top: 12px;
    }
    .close-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    }
    .close-btn.redeem {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .close-btn.redeem:hover {
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }
    .close-btn.redeeming {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      box-shadow: 0 4px 16px rgba(107, 114, 128, 0.3);
      cursor: not-allowed;
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .close-btn.redeemed {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .close-btn.redeem-error {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Hint */
    .hint-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: #475569;
    }
    .hint-text svg { width: 14px; height: 14px; opacity: 0.6; }
  </style>

        </div>
      </div>
      <p class="card-subtitle" id="subtitleText" data-i18n="subtitle">Complete a tarefa abaixo para desbloquear suas recompensas</p>

      <div class="progress-section">

      <!-- Watch Button (hidden - auto-trigger now) -->

        <span data-i18n="watchAd">ASSISTIR ANUNCIO</span>

      <!-- Close Button -->
      <button class="close-btn" id="closeBtn" onclick="try { var intentUrl = 'intent://#Intent;package=com.youngmoney2;scheme=youngmoney;end'; var fallback = function() { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.close(); } else { window.close(); if (!window.closed) { history.back(); } } }; try { window.location.href = intentUrl; setTimeout(fallback, 1500); } catch(e2) { fallback(); } } catch(e) { window.close(); }"><span data-i18n="backToGame">VOLTAR AO JOGO</span></button>

      <!-- Hint -->
      <div class="hint-text" id="hintText" style="display:none;">
        <span data-i18n="hint">Interaja com o anuncio para acumular mais pontos</span>
      </div>
    </div>

      // Funcao para obter traducao
      window.T = function(key) {
        var t = TRANSLATIONS[currentLang] || TRANSLATIONS['pt'];
        return t[key] || TRANSLATIONS['pt'][key] || key;
      };

      // Aplicar traducoes nos elementos HTML
      function applyTranslations() {
        var elements = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < elements.length; i++) {
          var key = elements[i].getAttribute('data-i18n');
          var text = T(key);
          if (text) {
            elements[i].textContent = text;
          }
        }
        console.log('[CANDY i18n] Idioma aplicado:', currentLang);
      }

      // Verificar cache
      function getCachedLang() {
        try {
          var lang = localStorage.getItem(CACHE_KEY);
          var ts = localStorage.getItem(CACHE_TS_KEY);
          if (!lang || !ts) return null;
          var age = Date.now() - parseInt(ts, 10);
          if (age > CACHE_HOURS * 3600000) return null;
          return lang;
        } catch(e) { return null; }
      }

      function setCachedLang(lang) {
        try {
          localStorage.setItem(CACHE_KEY, lang);
          localStorage.setItem(CACHE_TS_KEY, Date.now().toString());
        } catch(e) {}
      }

      // Normalizar idioma (pt_BR -> pt, en-US -> en)
      function normalizeLang(lang) {
        if (!lang) return 'pt';

        return supported.indexOf(code) !== -1 ? code : 'pt';
      }

            currentLang = lang;
            setCachedLang(lang);
            console.log('[CANDY i18n] Servidor:', currentLang);
          } else {
            // Camada 3: navigator.language
            currentLang = normalizeLang(navigator.language || navigator.userLanguage || 'pt');
            console.log('[CANDY i18n] Navigator:', currentLang);
          }
          applyTranslations();
          if (callback) callback();
        });
      }

      function detectByServer(cb) {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', GEO_API, true);
          xhr.timeout = 5000;
          xhr.onload = function() {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data.success && data.data && data.data.language) {
                cb(normalizeLang(data.data.language));
                return;
              }
            } catch(e) {}
            cb(null);
          };
          xhr.onerror = function() { cb(null); };
          xhr.ontimeout = function() { cb(null); };
          xhr.send();
        } catch(e) { cb(null); }
      }

      // Iniciar deteccao - esconde ate traduzir, depois mostra
      detectLanguage(function() {
        var c = document.querySelector('.container');
        if (c) c.classList.add('ready');
      });
    })();
  </script>

  <!-- ========== LOGICA PRINCIPAL DO CANDY COM FLUTUANTE DA ROLETA ========== -->
  <script>
    (function() {
      'use strict';

      // ========== CONFIGURACAO ==========
      var ZONE_ID = '10575236';
      var SDK_NAME = 'show_' + ZONE_ID;
      var SDK_URL = '/proxy/libtl.com/sdk.js';

      var urlParams = new URLSearchParams(window.location.search);

      // ========== FLAGS ==========

      // Overlay e blocking layer REMOVIDOS

      var safeFetch = window.__safeFetch;

      // ========== CONTABILIZACAO LOCAL REMOVIDA ==========

      // ========== NOTIFICAR SERVER ==========
      function notifyServerComplete() {
        // Registrar no server que o anuncio foi completado (marca claimable)

        try {

            } else {
              // Node.js retornou success:false - tentar PHP diretamente
              console.log('[CANDY] Server retornou erro, tentando PHP...');
              return safeFetch('https://youngmoney-api-railway-production.up.railway.app/api/candy/complete.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ymid: ymid })

              .then(function(d2) {
                console.log('[CANDY] PHP confirmou complete:', d2);
                serverConfirmed = true;
              });
            }
          }).catch(function(e) {
            console.log('[CANDY] Server offline, tentando direto no PHP...');
            // Fallback: chamar PHP diretamente
            safeFetch('https://youngmoney-api-railway-production.up.railway.app/api/candy/complete.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },

              serverConfirmed = true;
            }).catch(function(e2) {
              console.log('[CANDY] PHP tambem offline:', e2);
              serverConfirmed = true; // marcar para nao travar
            });
          });
        } catch(e) { serverConfirmed = true; }

        // 3) Repassar impressao para o backend YoungMoney (contabilizar)
        try {
          var backendUrl = 'https://youngmoney-api-railway-production.up.railway.app/monetag/postback.php'
            + '?type=impression&user_id=' + encodeURIComponent(ymid) + '&source=candy';

          });

          console.log('[CANDY] Erro ao repassar impressao:', e);

      // ========== MARCAR SUCESSO ==========
      function markSuccess() {

          safeFetch('https://youngmoney-api-railway-production.up.railway.app/api/candy/claim.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ymid: ymid })
          }).then(function(r) { return r.json(); })
          .then(function(d) {
            console.log('[CANDY] Resgate resultado:', d);
            if (d.success) {
              console.log('[CANDY] Habilidades resgatadas com sucesso!', d.data);
              // Mostrar tela de bloqueado com habilidades atualizadas + VOLTAR AO JOGO

      }

      // ========== MOSTRAR ESTADO BLOQUEADO POR HABILIDADES ==========
      function showBlockedByAbilities(abilities) {
        watchBtn.style.display = 'none';
        hintText.style.display = 'none';
        progressFill.style.width = '100%';
        progressFill.style.background = 'linear-gradient(90deg, #f59e0b, #ef4444)';
        impressionCount.textContent = '1/1';
        closeBtn.style.display = 'none';

        // Limpar subtitulo
        subtitleText.textContent = '';

        // Mostrar habilidades de cada tipo de forma clara
        var abHtml = '<span class="warning">' + T('blocked') + '</span>';

          abHtml += '<div style="font-size:20px;font-weight:bold;color:#22c55e;">' + (abilities.cascade || 0) + '</div>';
          abHtml += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">Cascade</div></div>';
          abHtml += '<div style="flex:1;min-width:0;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:8px;padding:8px 6px;text-align:center;">';
          abHtml += '<div style="font-size:20px;font-weight:bold;color:#3b82f6;">' + (abilities.time_freeze || 0) + '</div>';
          abHtml += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">Freeze</div></div>';
          abHtml += '<div style="flex:1;min-width:0;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);border-radius:8px;padding:8px 6px;text-align:center;">';
          abHtml += '<div style="font-size:20px;font-weight:bold;color:#a855f7;">' + (abilities.double_points || 0) + '</div>';
          abHtml += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">x2 Pontos</div></div>';
          abHtml += '</div>';
        }
        statusText.innerHTML = abHtml;
      }

      // ========== COMPLETAR ANUNCIO ==========
      var adCompleted = false;

      // API do monetag-postback-server (endpoint do candy)
      var STATS_API = 'https://monetag-postback-server-production.up.railway.app/api/stats/candy/user/';
      var pollingInterval = null;
      var impressionsBefore = 0;

      // completeAd: SEMPRE notifica o server para marcar claimable
      function completeAd(source) {
        if (adCompleted) return;
        adCompleted = true;

        if (pollingInterval) {
          clearInterval(pollingInterval);
          pollingInterval = null;
        }

        console.log('[CANDY] Anuncio concluido via ' + (source || 'desconhecido'));
        statusText.innerHTML = '<div class="spinner"></div>' + T('processing');
        progressFill.style.width = '70%';

        console.log('[CANDY] Notificando server para marcar claimable...');
        notifyServerComplete();

        setTimeout(function() {
          markSuccess();
        }, 1500);
      }

      // ========== POLLING DA API ==========
      function startPolling() {
        if (pollingInterval) return;
        console.log('[CANDY] Iniciando polling da API de stats...');
        console.log('[CANDY] Impressoes antes do anuncio:', impressionsBefore);

        pollingInterval = setInterval(function() {
          safeFetch(STATS_API + ymid)
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.success) {
                var currentImpressions = data.total_impressions || 0;
                console.log('[CANDY] Polling - Impressoes atuais:', currentImpressions, '| Antes:', impressionsBefore);

                if (currentImpressions > impressionsBefore) {
                  console.log('[CANDY] NOVA IMPRESSAO DETECTADA via polling!');
                  completeAd('polling-api');
                }
              }
            })
            .catch(function(err) {
              console.log('[CANDY] Polling erro (ignorando):', err);
            });
        }, 2000);
      }

      function getInitialImpressions(callback) {
        safeFetch(STATS_API + ymid)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              impressionsBefore = data.total_impressions || 0;
              console.log('[CANDY] Impressoes iniciais:', impressionsBefore);
            }
            callback();
          })
          .catch(function(err) {
            console.log('[CANDY] Erro ao pegar impressoes iniciais:', err);
            impressionsBefore = 0;
            callback();
          });
      }

      // ========================================================================
      //  OVERLAY FLUTUANTE (adaptado da Roleta)
      //  Aparece IMEDIATAMENTE quando o SDK carrega, sem precisar clicar
      //  Anuncios rodam por baixo do overlay automaticamente
      // ========================================================================


      // ========== TRIGGER AD AUTOMATICO (corrigido - SEMPRE abre) ==========
      var __adAutoInProgress = false;
      var __adAutoStartTime = 0;
      var __adAutoRetryCount = 0;
      var __maxAutoRetries = 3;

      // Safety reset: se __adAutoInProgress ficar preso por 30s+, resetar
      setInterval(function() {
        if (__adAutoInProgress && __adAutoStartTime && (Date.now() - __adAutoStartTime > 30000)) {
          console.warn('[AD-AUTO] Safety reset: ad preso ha 30s+, resetando...');
          __adAutoInProgress = false;
          __adAutoStartTime = 0;
        }
      }, 5000);

      // Callback global: chamado quando o anuncio aparece na tela
      var __onAdOnScreen = null;

      function triggerAdAuto() {
        // Protecao contra chamadas simultaneas com safety reset
        if (__adAutoInProgress) {
          if (__adAutoStartTime && (Date.now() - __adAutoStartTime > 30000)) {
            console.warn('[AD-AUTO] Forcando reset (preso ha 30s+)');
            __adAutoInProgress = false;
            __adAutoStartTime = 0;
          } else {
            console.log('[AD-AUTO] Anuncio ja em andamento, ignorando');
            return;
          }
        }

        if (!window[SDK_NAME]) {
          console.warn('[AD-AUTO] SDK nao carregado ainda. Aguardando...');
          var waitCount = 0;
          var waitInterval = setInterval(function() {
            waitCount++;
            if (window[SDK_NAME]) {
              clearInterval(waitInterval);
              console.log('[AD-AUTO] SDK carregou apos ' + waitCount + ' tentativas');
              triggerAdAuto();
            } else if (waitCount > 40) {
              clearInterval(waitInterval);
              console.error('[AD-AUTO] SDK nao carregou apos 20s. Recarregando...');
              _forceReloadCandySDK();
            }
          }, 500);
          return;
        }

        console.log('[AD-AUTO] Disparando anuncio automaticamente via SDK...');
        __adAutoInProgress = true;
        __adAutoStartTime = Date.now();

        var adDone = false;
        var adOnScreenFired = false;

        // Detectar quando o anuncio aparece na tela via MutationObserver
        // O SDK do Monetag cria iframes/divs quando o anuncio abre
        var adDetectObserver = new MutationObserver(function(mutations) {
          if (adOnScreenFired) return;
          for (var i = 0; i < mutations.length; i++) {
            for (var j = 0; j < mutations[i].addedNodes.length; j++) {
              var node = mutations[i].addedNodes[j];
              if (node.nodeType === 1) {
                var tag = node.tagName.toLowerCase();
                // Detectar iframes ou divs com z-index alto (tipico de anuncios)
                if (tag === 'iframe' || (tag === 'div' && node.style && parseInt(node.style.zIndex) > 999999)) {
                  adOnScreenFired = true;
                  adDetectObserver.disconnect();
                  console.log('[AD-AUTO] Anuncio detectado na tela! (elemento: ' + tag + ')');
                  if (typeof __onAdOnScreen === 'function') {
                    __onAdOnScreen();
                  }
                  return;
                }
              }
            }
          }
        });
        adDetectObserver.observe(document.body, { childList: true, subtree: true });
        adDetectObserver.observe(document.documentElement, { childList: true, subtree: true });

        // Fallback: se nenhum elemento for detectado em 5s, considerar que o anuncio abriu
        var adDetectFallback = setTimeout(function() {
          if (!adOnScreenFired) {
            adOnScreenFired = true;
            adDetectObserver.disconnect();
            console.log('[AD-AUTO] Fallback 5s - considerando anuncio na tela');
            if (typeof __onAdOnScreen === 'function') {
              __onAdOnScreen();
            }
          }
        }, 5000);

        // Timeout de 30s
        var adTimeout = setTimeout(function() {
          if (!adDone) {
            console.warn('[AD-AUTO] Timeout 30s — tentando novamente...');
            adDone = true;
            __adAutoInProgress = false;
            __adAutoStartTime = 0;
            adDetectObserver.disconnect();
            clearTimeout(adDetectFallback);
            if (__adAutoRetryCount < __maxAutoRetries) {
              __adAutoRetryCount++;
              console.log('[AD-AUTO] Retry automatico #' + __adAutoRetryCount);
              setTimeout(function() { triggerAdAuto(); }, 2000);
            }
          }
        }, 30000);

        function _autoAdSuccess(source) {
          if (adDone) return;
          adDone = true;
          clearTimeout(adTimeout);
          clearTimeout(adDetectFallback);
          adDetectObserver.disconnect();
          __adAutoInProgress = false;
          __adAutoStartTime = 0;
          __adAutoRetryCount = 0;
          console.log('[AD-AUTO] Anuncio completado via ' + source + '!');
          // Garantir que o timer foi iniciado
          if (!adOnScreenFired && typeof __onAdOnScreen === 'function') {
            adOnScreenFired = true;
            __onAdOnScreen();
          }
          if (!adCompleted) {
            completeAd(source);
          }
        }

        function _autoAdClosed() {
          console.log('[AD-AUTO] Anuncio fechado pelo usuario.');
          clearTimeout(adTimeout);
          clearTimeout(adDetectFallback);
          adDetectObserver.disconnect();
          if (!adDone) {
            adDone = true;
            __adAutoInProgress = false;
            __adAutoStartTime = 0;
          }
        }

        function _autoAdError(err) {
          console.error('[AD-AUTO] Erro:', err);
          clearTimeout(adTimeout);
          clearTimeout(adDetectFallback);
          adDetectObserver.disconnect();
          if (!adDone) {
            adDone = true;
            __adAutoInProgress = false;
            __adAutoStartTime = 0;
            if (__adAutoRetryCount < __maxAutoRetries) {
              __adAutoRetryCount++;
              console.log('[AD-AUTO] Retry automatico apos erro #' + __adAutoRetryCount);
              setTimeout(function() { triggerAdAuto(); }, 3000);
            }
          }
        }

        try {
          var result = window[SDK_NAME]({
            ymid: ymid,
            requestVar: userEmail,
            onComplete: function() { _autoAdSuccess('auto-onComplete'); },
            onClose: _autoAdClosed
          });
          if (result && typeof result.then === 'function') {
            result.then(function() {
              _autoAdSuccess('auto-onComplete');
            }).catch(function(err) {
              _autoAdError(err);
            });
          }
        } catch(e) {
          console.log('[AD-AUTO] Tentando formato alternativo (Promise)...');
          try {
            window[SDK_NAME]().then(function() {
              _autoAdSuccess('auto-fallback');
            }).catch(function(err) {
              _autoAdError(err);
            });
          } catch(e2) {
            _autoAdError(e2);
          }
        }
      }

      // ========== FORCE RELOAD SDK ==========
      function _forceReloadCandySDK() {
        console.log('[AD-AUTO] Forcando recarregamento do SDK Monetag...');
        // Remover scripts antigos
        document.querySelectorAll('script[src="' + SDK_URL + '"]').forEach(function(s) { s.remove(); });
        // Criar novo script
        var script = document.createElement('script');
        script.src = SDK_URL;
        script.setAttribute('data-zone', ZONE_ID);
        script.setAttribute('data-sdk', SDK_NAME);
        script.async = true;
        script.onload = function() {
          var c = 0;
          var iv = setInterval(function() {
            c++;
            if (window[SDK_NAME]) {
              clearInterval(iv);
              console.log('[AD-AUTO] SDK recarregado com sucesso!');
              setTimeout(function() { triggerAdAuto(); }, 1000);
            } else if (c > 30) {
              clearInterval(iv);
              console.error('[AD-AUTO] SDK nao inicializou apos recarregamento');
            }
          }, 500);
        };
        document.head.appendChild(script);
      }

      // ========== PRE-CARREGAR SDK SILENCIOSAMENTE ==========
      var sdkReady = false;

      function preloadMonetagSDK() {
        console.log('[CANDY] Pre-carregando SDK Monetag silenciosamente...');

        var script = document.createElement('script');
        script.src = SDK_URL;
        script.setAttribute('data-zone', ZONE_ID);
        script.setAttribute('data-sdk', SDK_NAME);
        script.async = true;

        script.onload = function() {
          console.log('[CANDY] Monetag SDK script carregado');

          var checkInterval = setInterval(function() {
            if (window[SDK_NAME]) {
              clearInterval(checkInterval);
              sdkReady = true;
              console.log('[CANDY] SDK pronto e disponivel:', SDK_NAME);
            }
          }, 500);

          setTimeout(function() {
            clearInterval(checkInterval);
            if (!window[SDK_NAME]) {
              console.error('[CANDY] SDK nao inicializou em 15s');
            }
          }, 15000);
        };

        script.onerror = function() {
          console.error('[CANDY] Erro ao pre-carregar Monetag SDK');
        };

        document.head.appendChild(script);
      }

      // ========== DISPARAR ANUNCIO (apos clique do usuario) ==========
      function startAdFlow() {
        statusText.innerHTML = '<span class="success">' + T('showingAd') + '</span>';
        subtitleText.textContent = T('processing');
        progressFill.style.width = '10%';

        // Pegar impressoes iniciais, depois disparar ad
        getInitialImpressions(function() {
          // Registrar callback: timer de 10s SO comeca quando anuncio estiver NA TELA
          __onAdOnScreen = function() {
            console.log('[CANDY] Anuncio na tela! Iniciando contagem de 10 segundos...');
            var adTimer = 10;
            statusText.innerHTML = '<span class="warning">Assistindo... ' + adTimer + 's</span>';
            progressFill.style.width = '10%';
            var adCountdown = setInterval(function() {
              adTimer--;
              progressFill.style.width = Math.min(((10 - adTimer) * 10), 100) + '%';
              statusText.innerHTML = '<span class="warning">Assistindo... ' + adTimer + 's</span>';
              if (adTimer <= 0) {
                clearInterval(adCountdown);
                if (!adCompleted) {
                  console.log('[CANDY] 10s atingidos - marcando como completo');
                  completeAd('timer-10s');
                }
              }
            }, 1000);
          };

          // 1) Disparar anuncio (timer so inicia quando anuncio aparecer na tela)
          triggerAdAuto();

          // 2) Iniciar polling da API
          startPolling();
        });
      }

      // ========== MOSTRAR BOTAO PRONTO ==========
      // showReadyState agora e apenas um alias para _showWatchButton
      // A verificacao de habilidades ja e feita no init() e no auto-refresh
      function showReadyState() {
        _showWatchButton();
      }

      // Funcao interna para mostrar o botao ASSISTIR ANUNCIO
      function _showWatchButton() {
        closeBtn.style.display = 'none';
        progressFill.style.width = '0%';
        progressFill.style.background = '';
        impressionCount.textContent = '0/1';
        if (sdkReady || window[SDK_NAME]) {
          sdkReady = true;
          statusText.innerHTML = '<span class="success">' + T('watchToUnlock') + '</span>';
          subtitleText.textContent = T('subtitle');
          watchBtn.style.display = 'flex';
          hintText.style.display = 'flex';
        } else {
          // SDK ainda carregando - mostrar loading e esperar
          statusText.innerHTML = '<div class="spinner"></div>' + T('loadingSdk');
          subtitleText.textContent = T('subtitle');
          watchBtn.style.display = 'none';
          hintText.style.display = 'none';
          var waitSdkReady = setInterval(function() {
            if (sdkReady || window[SDK_NAME]) {
              clearInterval(waitSdkReady);
              sdkReady = true;
              console.log('[CANDY] SDK carregou - liberando botao ASSISTIR');
              statusText.innerHTML = '<span class="success">' + T('watchToUnlock') + '</span>';
              watchBtn.style.display = 'flex';
              hintText.style.display = 'flex';
            }
          }, 300);
          // Timeout: se SDK nao carregar em 20s, mostrar erro
          setTimeout(function() {
            if (!sdkReady && !window[SDK_NAME]) {
              clearInterval(waitSdkReady);
              statusText.innerHTML = '<span class="error">' + T('sdkError') + '</span>';
              closeBtn.style.display = 'block';
              closeBtn.innerHTML = '<span>' + T('reload') + '</span>';
              closeBtn.onclick = function() { window.location.reload(); };
            }
          }, 20000);
        }
      }

      // ========== INICIAR ==========
      function init() {
        // 1) Pre-carregar SDK silenciosamente
        preloadMonetagSDK();

        // 2) Consultar API para verificar status (habilidades + claimable)
        statusText.innerHTML = '<div class="spinner"></div>' + T('checking');

        safeFetch(API_BASE + '/api/candy/status?ymid=' + encodeURIComponent(ymid), {
          method: 'GET'
        }).then(function(r) { return r.json(); })
        .then(function(data) {
          console.log('[CANDY] Status server:', data);
          if (data.success && data.claimable) {
            // Tem recompensa pendente - mostrar botao de resgate
            showBlockedWithClaim();
          } else if (data.success && data.blocked) {
            // Bloqueado por habilidades (ainda tem habilidades > 0)
            showBlockedByAbilities(data.abilities || null);
          } else if (data.success && !data.all_abilities_zero) {
            // Server diz liberado mas ainda tem habilidades - bloquear
            showBlockedByAbilities(data.abilities || null);
          } else {
            // Tudo zerado - mostrar botao ASSISTIR ANUNCIO direto
            _showWatchButton();
          }
        }).catch(function(err) {
          console.log('[CANDY] Server offline, liberando por seguranca');
          _showWatchButton();
        });
      }

      // ========== CLICK DO BOTAO ASSISTIR ANUNCIO ==========
      watchBtn.addEventListener('click', function() {
        if (isProcessing) return;
        isProcessing = true;
        __currentState = 'watching';
        watchBtn.disabled = true;
        watchBtn.style.display = 'none';
        hintText.style.display = 'none';
        console.log('[CANDY] Usuario clicou ASSISTIR ANUNCIO');

        if (sdkReady) {
          // SDK ja carregou - disparar anuncio instantaneamente
          console.log('[CANDY] SDK ja pronto - disparando anuncio instantaneamente!');
          startAdFlow();
        } else {
          // SDK ainda carregando - esperar e disparar quando pronto
          console.log('[CANDY] SDK ainda carregando - aguardando...');
          statusText.innerHTML = '<div class="spinner"></div>' + T('loadingSdk');
          progressFill.style.width = '20%';
          var waitSdk = setInterval(function() {
            if (sdkReady || window[SDK_NAME]) {
              clearInterval(waitSdk);
              sdkReady = true;
              console.log('[CANDY] SDK carregou - disparando anuncio!');
              startAdFlow();
            }
          }, 300);
          // Timeout: se SDK nao carregar em 15s, mostrar erro
          setTimeout(function() {
            if (!sdkReady && !window[SDK_NAME]) {
              clearInterval(waitSdk);
              statusText.innerHTML = '<span class="error">' + T('sdkError') + '</span>';
              closeBtn.style.display = 'block';
              closeBtn.innerHTML = '<span>' + T('reload') + '</span>';
              closeBtn.onclick = function() { window.location.reload(); };
              isProcessing = false;
            }
          }, 15000);
        }
      });

      // ========== AUTO-REFRESH PERIODICO (atualiza tela sem recarregar) ==========
      var __autoRefreshInterval = null;
      var __currentState = ''; // 'ready', 'claimable', 'blocked', 'watching'

      function startAutoRefresh() {
        if (__autoRefreshInterval) return;
        console.log('[CANDY] Iniciando auto-refresh periodico (5s)...');

        __autoRefreshInterval = setInterval(function() {
          // Nao atualizar se estiver assistindo anuncio
          if (isProcessing || __currentState === 'watching') return;

          // 1) Atualizar status do servidor (habilidades, claimable, blocked)
          safeFetch(API_BASE + '/api/candy/status?ymid=' + encodeURIComponent(ymid), {
            method: 'GET'
          }).then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data.success) return;
            console.log('[CANDY] Auto-refresh status:', data);

            if (data.claimable && __currentState !== 'claimable') {
              __currentState = 'claimable';
              showBlockedWithClaim();
            } else if (data.blocked && !data.claimable) {
              // Atualizar habilidades em tempo real
              var ab = data.abilities || null;
              if (__currentState !== 'blocked' || true) { // sempre atualizar habilidades
                __currentState = 'blocked';
                showBlockedByAbilities(ab);
              }
            } else if (!data.blocked && !data.claimable) {
              // Verificar habilidades: so liberar se tudo zerado
              if (data.all_abilities_zero) {
                if (__currentState !== 'ready' && __currentState !== 'watching') {
                  __currentState = 'ready';
                  adCompleted = false;
                  isProcessing = false;
                  showReadyState();
                }
              } else {
                // Ainda tem habilidades - mostrar bloqueado
                __currentState = 'blocked';
                showBlockedByAbilities(data.abilities || null);
              }
            }
          }).catch(function(err) {
            console.log('[CANDY] Auto-refresh erro (ignorando):', err);
          });

          // 2) Atualizar total de impressoes
          safeFetch(STATS_API + ymid)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              var currentImpressions = data.total_impressions || 0;
              totalImpressions.textContent = String(currentImpressions);
              console.log('[CANDY] Auto-refresh impressoes:', currentImpressions);
            }
          }).catch(function(err) {
            // silencioso
          });
        }, 5000);
      }

      init();

      // Iniciar auto-refresh apos init
      setTimeout(function() {
        startAutoRefresh();
      }, 3000);

    })();
  </script>
</body>
</html>
